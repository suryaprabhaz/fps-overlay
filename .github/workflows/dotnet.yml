name: SuryaHUD CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore SuryaHUD.sln
      - run: dotnet build SuryaHUD.sln --configuration Release --no-restore
      - run: dotnet test SuryaHUD.sln --configuration Release --no-build --verbosity normal
