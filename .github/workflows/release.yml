name: SuryaHUD Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish SuryaHUD/SuryaHUD.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath SuryaHUD-win-x64.zip
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: SuryaHUD-win-x64.zip
